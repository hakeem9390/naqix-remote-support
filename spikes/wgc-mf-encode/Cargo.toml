[package]
name = "wgc-mf-encode"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Spike C: WGC capture -> zero-copy D3D11 -> Media Foundation hardware H.264 -> Annex-B"

[dependencies]
anyhow.workspace = true
windows-capture.workspace = true

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  # VARIANT lives here, and without it ICodecAPI's whole impl block is cfg'd
  # out - which presents as "no method named SetValue", not a missing feature.
  "Win32_System_Ole",
  "Win32_System_Threading",
]
