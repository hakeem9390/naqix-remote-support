# nginx reverse proxy for MeshCentral.
#
# Use a REAL CA certificate. A self-signed cert is what triggers the
# CVE-2026-66420 cross-site WebSocket hijacking bypass path - this is not a
# convenience preference.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name remote.naqix.example;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name remote.naqix.example;

    ssl_certificate     /etc/letsencrypt/live/remote.naqix.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.naqix.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No X-Frame-Options / frame-ancestors DENY here: the plan embeds the
    # viewer in Naqix, which is what allowFraming enables. Restrict the
    # embedding origin explicitly instead of blocking framing outright.
    add_header Content-Security-Policy "frame-ancestors 'self' https://app.naqix.example" always;

    # Agents push file transfers and software inventory through this.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:4430/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # KVM and terminal sessions are long-lived and mostly idle in one
        # direction. Default 60s timeouts will sever them mid-session.
        proxy_connect_timeout 60s;
        proxy_send_timeout    24h;
        proxy_read_timeout    24h;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
